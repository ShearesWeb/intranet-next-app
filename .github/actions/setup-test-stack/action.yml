# Installs Node + JDK/Liquibase + psql, then `make db-up`. The calling job must
# have already checked out the repo with the private vendor/intranet submodule.

name: Setup Test Stack
description: Boot Postgres + PostgREST, apply schema via Liquibase, seed persona fixtures.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22.22"

runs:
  using: composite
  steps:
    - name: 1. ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: 2. 📦 Install Dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: 3. ☕ Setup JDK (for Liquibase)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: 4. 🗄️ Install Liquibase (pinned tarball, deterministic)
      shell: bash
      env:
        LIQUIBASE_VERSION: 4.31.1
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TOOL_CACHE/liquibase/$LIQUIBASE_VERSION"
        if [ ! -x "$install_dir/liquibase" ]; then
          mkdir -p "$install_dir"
          url="https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.tar.gz"
          echo "Downloading Liquibase ${LIQUIBASE_VERSION} from $url"
          curl --fail --location --retry 3 --retry-delay 5 -o /tmp/liquibase.tar.gz "$url"
          tar -xzf /tmp/liquibase.tar.gz -C "$install_dir"
        fi
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/liquibase" --version

    - name: 5. 🐘 Ensure psql (postgresql client) is available
      shell: bash
      run: |
        set -euo pipefail
        if command -v psql >/dev/null 2>&1; then
          echo "psql already present: $(psql --version)"
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version
        fi

    - name: 6. 🌱 Bring up the DB (Postgres + schema + seed + PostgREST)
      shell: bash
      run: make db-up
