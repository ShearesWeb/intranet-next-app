# .github/workflows/4-prd-deploy.yaml
name: Production Deploy (Cloudflare)

# Trigger: workflow_dispatch only, run against the production tag you want to
# ship — pick it in the "Use workflow from" dropdown (or `gh workflow run
# 4-prd-deploy.yaml --ref vX.Y.Z`). The dispatched ref *is* the deploy target,
# so there is no tag input to keep in sync with it.
#
# `3-preprod-deploy.yaml` creates `vX.Y.Z` automatically once that build's
# `vX.Y.Z-rc` has deployed to preprod, so the tag says "this passed preprod",
# not "send this to prd". Promotion is the deliberate act of running this
# workflow against such a tag.
#
# Do NOT add a `push: tags` trigger here. Tag creation is automated now, so a
# push trigger would make every green preprod deploy ship itself to prd. That is
# currently held back only by GitHub declining to re-trigger on a GITHUB_TOKEN
# tag push — an implicit guard that disappears the moment the promote job is
# switched to a PAT or App token.
on:
  workflow_dispatch: {}

run-name: Deploy ${{ github.ref_name }} to prd

concurrency:
  group: "prd-deploy"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: ⚙️ Deploy to Cloudflare (prd)
    runs-on: ubuntu-latest

    environment:
      name: prd
      url: https://intranet.shweb.org

    env:
      # Embedded into the client bundle at build time.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      # prd stores this as NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, preprod as
      # ..._DEFAULT_KEY. Accept either until the two are named the same.
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Consumed by the OpenNext/wrangler deploy step.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: 1. ✅ Validate Dispatched Ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Dispatched on $REF_TYPE '$TAG' — prd deploys run from a vX.Y.Z tag."; exit 1
          fi
          case "$TAG" in
            v*.*.*-*) echo "::error::'$TAG' is a pre-release tag — prd ships clean vX.Y.Z only."; exit 1 ;;
            v*.*.*) ;;
            *) echo "::error::'$TAG' is not a vX.Y.Z tag."; exit 1 ;;
          esac

      - name: 2. 📄 Checkout Repository
        uses: actions/checkout@v4

      - name: 3. ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm

      - name: 4. ⬇️ Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: 5. 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Provision Cloudflare infra (R2 cache bucket + custom domain) before the
      # Worker deploy, so the R2 binding in wrangler.jsonc resolves. State lives
      # in R2 (s3 backend); prd uses key prd/intranet-web/terraform.tfstate.
      - name: 6. 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: 7. ☁️ Terraform Apply (prd infra)
        working-directory: infra
        env:
          # Cloudflare provider (api_token = var.cloudflare_api_token).
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # R2 (s3-compatible) state backend.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          terraform init -backend-config=config/prd.tfbackend
          terraform apply -var-file=config/prd.tfvars -auto-approve

      - name: 8. 🚧 Build + Deploy with OpenNext (Cloudflare)
        run: make deploy ENV=prd
