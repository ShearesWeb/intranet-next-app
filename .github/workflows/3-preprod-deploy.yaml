# .github/workflows/3-preprod-deploy.yaml
name: Pre-production Deploy (Cloudflare)

# Trigger — exactly two cases:
#   1. A pull request is merged into `main`.
#      -> Auto-create the next `vX.Y.Z-beta` tag (patch bump from the latest
#         beta tag), then deploy that commit to Cloudflare preprod.
#   2. A pre-production tag `vX.Y.Z-beta` is pushed.
#      -> Deploy that tag directly (use this to redeploy, or to cut a
#         minor/major bump that the auto patch-bump won't produce).
#
# Note: a tag created by the default GITHUB_TOKEN does NOT re-trigger workflows,
# so the PR-merge path must create the tag AND deploy within this same run
# rather than relying on the tag-push trigger.
on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc"

concurrency:
  group: "preprod-deploy"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Case 1: PR merged -> compute + create the next `vX.Y.Z-beta` tag.
  # Skipped entirely on the tag-push path (Case 2).
  # ---------------------------------------------------------------------------
  tag:
    name: 🏷️ Create Pre-production Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: 1. 📄 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 2. 🔢 Compute Next rc Tag
        id: bump
        run: |
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*-rc' --sort=-v:refname | head -n1)"

          if [ -z "$latest" ]; then
            next="v0.1.0-rc"
          else
            core="${latest#v}"
            core="${core%-rc}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$core"
            PATCH=$((PATCH + 1))
            next="v${MAJOR}.${MINOR}.${PATCH}-rc"
          fi

          echo "Previous tag: ${latest:-<none>}"
          echo "Next tag:     $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: 3. 🏷️ Create + Push Tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG" "$MERGE_SHA"
          git push origin "$NEW_TAG"

  # ---------------------------------------------------------------------------
  # Deploy to Cloudflare preprod.
  # Runs on the tag-push path, OR after the `tag` job succeeds on PR merge.
  # ---------------------------------------------------------------------------
  deploy:
    name: ⚙️ Deploy to Cloudflare (preprod)
    runs-on: ubuntu-latest
    needs: [tag]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && needs.tag.result == 'success'))

    environment:
      name: preprod
      url: https://beta.intranet.shweb.org

    env:
      # Embedded into the client bundle at build time.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
      # Consumed by the OpenNext/wrangler deploy step.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: 1. 📄 Checkout Repository
        uses: actions/checkout@v4
        with:
          # PR-merge path: check out the tag we just created.
          # Tag-push path: needs.tag.outputs.tag is empty -> fall back to the pushed tag ref.
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      - name: 2. ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm

      - name: 3. ⬇️ Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: 4. 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Provision Cloudflare infra (R2 cache bucket + custom domain) before the
      # Worker deploy, so the R2 binding in wrangler.jsonc resolves. State lives
      # in R2 (s3 backend); preprod uses key preprod/intranet-web/terraform.tfstate.
      - name: 5. 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: 6. ☁️ Terraform Apply (preprod infra)
        working-directory: infra
        env:
          # Cloudflare provider (api_token = var.cloudflare_api_token).
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # R2 (s3-compatible) state backend.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          terraform init -backend-config=config/preprod.tfbackend
          terraform apply -var-file=config/preprod.tfvars -auto-approve

      - name: 7. 🚧 Build + Deploy with OpenNext (Cloudflare)
        run: npm run deploy:preprod
