# .github/workflows/2-merge-request-ci.yml
name: Merge Request CI

# Trigger:
# - Runs when a pull request targets the `main` branch
#
# Jobs:
#   - build-static-assets : fast verification gate (prettier/lint/typecheck/
#                           fixtures/unit/build). No DB, no submodule.
#   - integration-tests   : live local Supabase + vitest integration suite.
#
# REQUIRED SECRET — `SUBMODULE_SSH_KEY` (repo-scoped read-only deploy key)
#   The integration job fetches the PRIVATE `vendor/intranet` submodule (a
#   separate repo). The built-in GITHUB_TOKEN can't read a sibling private repo,
#   so the job loads a read-only deploy key for ShearesWeb/intranet via
#   ssh-agent (checkout uses GITHUB_TOKEN for this repo). One-time setup:
#   docs/TESTING.md. The `build-static-assets` job does NOT need it.
on:
  pull_request:
    branches:
      - main

jobs:
  build-static-assets:
    name: ⚙️ Build Next.js Static Assets
    runs-on: ubuntu-latest

    # No `environment:` is set — the MR workflow runs verification checks and
    # `next build`, not a deployment. GitHub treats any job with `environment:`
    # as a deployment in the PR UI, which is misleading for a check job.
    # The build doesn't connect to Supabase at compile time; it only embeds the
    # NEXT_PUBLIC_* values into the client bundle. Placeholders below are
    # sufficient for the build to succeed. Real Supabase config is scoped to
    # the preprod and prd release workflows (3-* / 4-*).
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder-publishable-key

    steps:
      - name: 1. 📄 Checkout Repository
        uses: actions/checkout@v4

      - name: 2. ⚙️ Detect Package Manager
        id: detect-pm
        run: |
          if [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
          else
            echo "Unable to detect package manager"
            exit 1
          fi

      - name: 3. ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: ${{ steps.detect-pm.outputs.manager }}

      - name: 4. ⬇️ Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: 5. 📦 Install Dependencies
        run: |
          if [ "${{ steps.detect-pm.outputs.manager }}" = "npm" ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            yarn install --frozen-lockfile --prefer-offline
          fi

      - name: 6. 🎨 Prettier Check
        run: ${{ steps.detect-pm.outputs.manager }} run format:check

      - name: 7. 🧹 Lint
        run: ${{ steps.detect-pm.outputs.manager }} run lint

      - name: 8. 🔎 Typecheck
        run: ${{ steps.detect-pm.outputs.manager }} run typecheck

      - name: 9. 🧾 Fixtures Drift Check
        run: ${{ steps.detect-pm.outputs.manager }} run fixtures:check

      - name: 10. 🧪 Unit + Component Tests
        run: ${{ steps.detect-pm.outputs.manager }} test

      - name: 11. 🚧 Build with Next.js
        run: ${{ steps.detect-pm.outputs.manager }} run build

  integration-tests:
    name: 🧬 Integration Tests (live Supabase)
    runs-on: ubuntu-latest

    steps:
      - name: 1. 🔑 Load vendor/intranet deploy key (ssh-agent)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}

      - name: 2. 📄 Checkout Repository (main repo only)
        uses: actions/checkout@v4
        # Submodules are intentionally NOT fetched here. Whenever actions/checkout
        # fetches submodules it injects a global
        #   url.https://github.com/.insteadOf git@github.com:
        # rewrite and clones them over HTTPS with GITHUB_TOKEN — which can't read
        # the private sibling repo (vendor/intranet), so the clone fails with
        # "repository not found". That rewrite runs whenever submodules are
        # requested and is NOT suppressed by persist-credentials: false. So the
        # main repo is checked out over HTTPS here, then the submodule is fetched
        # over SSH (ssh-agent deploy key) in the next step, free of the rewrite.

      - name: 3. 🔗 Fetch private submodule over SSH (deploy key)
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: 4. 🧰 Setup Test Stack
        uses: ./.github/actions/setup-test-stack

      - name: 5. 🧬 Run Integration Tests
        run: npm run test:integration
